const KR='Keraton Jawa (Yogyakarta & Surakarta)';
const M={mega:{n:'Mega Mendung',r:'Cirebon',d:'Pola awan bergulung berlapis-lapis yang menjadi ciri khas batik Cirebon. Banyak literatur mengaitkannya dengan pengaruh budaya Tiongkok pada kesultanan pesisir Cirebon.',p:'Awan lazim ditafsirkan sebagai simbol ketenangan dan pembawa hujan (kesuburan) menurut tuturan tradisi. Tafsir dapat bervariasi.'},
jlam:{n:'Jlamprang',r:'Pekalongan',d:'Pola geometris simetris berbentuk bintang dan ceplok yang identik dengan Pekalongan. Disebut-sebut terinspirasi kain patola dari India yang masuk lewat perdagangan.',p:'Maknanya lebih sering dibahas sebagai kekayaan akulturasi budaya pesisir daripada satu filosofi tunggal.'},
parang:{n:'Parang',r:'Yogyakarta & Solo',d:'Garis diagonal bergelombang berbentuk huruf S yang berulang; keluarganya mencakup Parang Rusak dan Parang Barong (varian berukuran besar). Dalam tradisi keraton Jawa, pola parang tertentu pernah menjadi pola larangan bagi kalangan terbatas.',p:'Dimaknai sebagai jati diri, perjuangan, dan kesinambungan. Menurut tuturan tradisi, motif ini dikaitkan dengan Sultan Agung (Mataram Islam). Ketentuan pemakaian berbeda antar keraton.'},
trun:{n:'Truntum',r:'Surakarta (Solo)',d:'Pola bintang atau kuntum bunga kecil yang tersusun rapi, seperti taburan bunga tanjung di langit malam.',p:'Menurut tuturan tradisi, diciptakan Kanjeng Ratu Kencana (permaisuri Pakubuwana III) dan dimaknai sebagai cinta kasih yang tulus dan bersemi kembali; lazim dipakai orang tua pengantin.'},
kawung:{n:'Kawung',r:'Yogyakarta',d:'Pola geometris empat lingkaran/elips yang berpusat pada satu titik dan tersusun teratur. Dikenal sebagai salah satu motif geometris tertua; sejarahnya sering ditelusuri hingga masa Mataram Kuno/Kediri.',p:'Menurut tuturan tradisi dimaknai keadilan, kesucian, dan struktur semesta; sebagian tafsir mengaitkannya dengan buah kolang-kaling. Tafsir bervariasi.'},
sekar:{n:'Sekar Jagad',r:'Yogyakarta & Solo',d:'Bidang-bidang sekat asimetris seperti pulau-pulau, masing-masing berisi ragam motif (sekar = bunga, jagad = dunia). Dikaitkan dengan era keraton sekitar abad ke-17.',p:'Dimaknai sebagai keragaman, keindahan dunia, dan keharmonisan.'}};

function mo(id,c){if(IMG[id])return '<img class="mo '+(c||'')+'" src="'+IMG[id]+'" alt="Motif '+M[id].n+'" decoding="async">';const [w,h,bg,g]=PT[id],i='p'+(++pid);return `<svg class="mo ${c||''}" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrasi pola ${M[id].n}"><defs><pattern id="${i}" width="${w}" height="${h}" patternUnits="userSpaceOnUse">${g}</pattern></defs><rect width="120" height="120" fill="${bg}"/><rect width="120" height="120" fill="url(#${i})"/></svg>`}

const SM=[['s1','Catat Penjualan Harian','Simpan satu transaksi penjualan yang valid.'],['s2','Kuis Wawasan Batik','Jawab minimal 2 dari 3 soal dengan benar.'],['s3','Cek Sisa Stok Gudang','Periksa stok dan konfirmasi.'],['s4','Catat Pengeluaran Operasional','Simpan satu pengeluaran valid.'],['s5','Ulasan Pembeli','Isi catatan masukan pelanggan.'],['s6','Riset Tren Model & Motif','Pelajari materi referensi dan simpan catatan.'],['s7','Kalkulator Margin Cuan','Hitung dan simpan estimasi margin.']];

const MS=()=>U[me].role==='seller'?SM:EM;
function done(id){const d=cur(),t=today();d.done[t]=d.done[t]||{};if(d.done[t][id])return;d.done[t][id]=1;d.xp+=CFG.XP;let m='Misi selesai! +'+CFG.XP+' XP';if(MS().every(x=>d.done[t][x[0]])&&d.last!==t){d.streak=(d.last===addDays(t,-1)?d.streak:0)+1;d.best=Math.max(d.best,d.streak);d.last=t;m+=' · Semua misi selesai, streak '+d.streak+'!';confetti()}if(save())toast(m);setTimeout(render,50)}
const isDone=id=>!!(cur().done[today()]||{})[id];
const QS=[{q:'Kapan UNESCO menetapkan batik Indonesia sebagai Warisan Budaya Takbenda?',o:['2 Oktober 2009','17 Agustus 1945','28 Oktober 1928','1 Juni 2012'],a:0,e:'Penetapan UNESCO jatuh pada 2 Oktober 2009, kini diperingati sebagai Hari Batik Nasional.'},
{q:'Batik yang motifnya digambar langsung memakai canting disebut?',o:['Batik cap','Batik tulis','Batik printing','Tenun ikat'],a:1,e:'Batik tulis dibuat dengan menggambar malam memakai canting.'},
{q:'Pekalongan dikenal dengan julukan?',o:['Kota Pahlawan',"The World's City of Batik",'Kota Gudeg','Kota Kretek'],a:1,e:"Pekalongan dikenal sebagai The World's City of Batik."},
{q:'Batik cap menggunakan alat apa untuk menerakan malam?',o:['Kuas lebar','Canting','Stempel (cap) tembaga','Mesin sablon'],a:2,e:'Cap tembaga ditekan ke kain berlapis malam sehingga lebih cepat daripada tulis.'},

const RG=['Cirebon','Pekalongan','Papua','Aceh','Bali'];
function quiz(id,qs,pass,intro){let i=0,c=0,lock=0;const m=modal();
window.qa=k=>{if(lock)return;lock=1;const q=qs[i],ok=k===q.a;if(ok)c++;m.innerHTML=`<h3>${ok?'Benar!':'Belum tepat'}</h3><p>${esc(q.o[q.a])}. ${esc(q.e)}</p><button class="b" onclick="qn()">Lanjut</button>`};
window.qn=()=>{i++;lock=0;r()};
const r=()=>{if(i>=qs.length){const ok=c>=pass;m.innerHTML=`<h3>Hasil: ${c}/${qs.length}</h3><p>${ok?'Kriteria terpenuhi.':'Butuh minimal '+pass+' jawaban benar. Coba lagi.'}</p><button class="b" onclick="${ok?'closeM()':`act('${id}')`}">${ok?'Tutup':'Ulangi'}</button>`;if(ok&&!isDone(id))done(id);return}
const q=qs[i];m.innerHTML=`<small>Soal ${i+1}/${qs.length}</small>${intro&&i==0?`<p>${intro}</p>`:''}<h3>${esc(q.q)}</h3>${q.svg?`<div style="height:150px;border-radius:14px;overflow:hidden;margin-bottom:10px">${q.svg}</div>`:''}<div style="display:grid;gap:8px">${q.o.map((o,k)=>`<button class="b o" onclick="qa(${k})">${esc(o)}</button>`).join('')}</div><p><button class="b s o" onclick="closeM()">Tutup</button></p>`};r()}
function mkq(txt,id,opts,e){const o=shuf(opts);return {q:txt,svg:mo(id),o:o.map(x=>x),a:0,e}}
function sq(q,corr,opts,e,svg){const o=shuf(opts);return {q,svg,o,a:o.indexOf(corr),e}}

if(id=='s1')return location.hash='#/app/sales';if(id=='s4')return location.hash='#/app/expenses';
if(id=='s2')return quiz(id,shuf(QS).slice(0,3),2);
if(id=='e7')return quiz(id,shuf(QS).slice(0,5),3);
if(id=='e1'){const ks=Object.keys(M);return quiz(id,shuf(ks).slice(0,3).map(k=>sq('Motif apakah ini?',M[k].n,shuf(ks.filter(x=>x!=k)).slice(0,3).map(x=>M[x].n).concat(M[k].n),'Ini motif '+M[k].n+' ('+M[k].r+').',mo(k))),2)}
if(id=='e2'){const ks=Object.keys(M);return quiz(id,shuf(ks).slice(0,3).map(k=>sq('Dari daerah manakah motif '+M[k].n+' berasal?',M[k].r,shuf(RG.filter(x=>x!=M[k].r)).slice(0,3).concat(M[k].r),M[k].n+' berasal dari '+M[k].r+'.',mo(k))),2)}
if(id=='e4'){const O=['Batik (proses malam)','Bukan batik (printing/tenun)'];return quiz(id,shuf([['Kain dengan motif digambar memakai canting dan malam panas, lalu dicelup warna.',0,'Itu batik tulis.'],['Kain dengan motif dicap memakai stempel tembaga berisi malam.',0,'Itu batik cap: tetap memakai malam.'],['Kain bermotif batik yang dicetak mesin/digital tanpa proses malam.',1,'Itu kain bermotif batik (printing), bukan batik tradisional.'],['Kain yang ditenun dengan benang berwarna membentuk pola.',1,'Itu tenun, bukan batik.']]).map(x=>({q:x[0],o:O,a:x[1],e:x[2]})),3)}

function game(){const cv=$('#cv');if(!cv)return;const c=cv.getContext('2d'),GY=170,G=GY-34;let st=0,y=G,vy=0,ob=[],sp=3.2,sc=0,f=0,tr=[],dist=0,gap=320,last=0;
function reset(){y=G;vy=0;ob=[];sp=3.2;sc=0;f=0;tr=[];dist=0;gap=320}
function jump(){if(!cv.isConnected)return;if(st!=1){st=1;reset();last=0;requestAnimationFrame(loop)}else if(y>=G-.5)vy=-11}
function bg(){c.fillStyle='#f6e8c8';c.fillRect(0,0,640,200);c.strokeStyle='#c9962b30';c.lineWidth=1.5;const o=-(f*sp*.3)%60;for(let x=o-60;x<700;x+=60)for(let r=0;r<3;r++){const cy=24+r*46+(Math.floor((x-o)/60)%2)*20;c.beginPath();c.ellipse(x+30,cy,12,7,0,0,6.3);c.stroke();c.beginPath();c.ellipse(x+30,cy,7,12,0,0,6.3);c.stroke()}
c.fillStyle='#e6cf98';c.fillRect(0,GY,640,30);c.fillStyle='#4a2c14';c.fillRect(0,GY,640,3);c.fillStyle='#b8862b';const go=-(f*sp)%28;for(let x=go;x<650;x+=28){c.beginPath();c.moveTo(x,GY+16);c.lineTo(x+9,GY+9);c.lineTo(x+18,GY+16);c.lineTo(x+9,GY+23);c.fill()}}
function trail(){c.lineCap='round';c.lineWidth=4;for(let i=1;i<tr.length;i++){const a=tr[i-1],b=tr[i];c.strokeStyle='rgba(30,43,94,'+Math.max(0,Math.min(.9,b.x/110))+')';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}}
function canting(){c.save();c.translate(62,y);c.translate(17,17);c.rotate(Math.max(-.35,Math.min(.35,vy*.035)));c.translate(-17,-17);c.fillStyle='#8b5a2b';c.fillRect(-14,11,22,6);c.fillStyle='#5e3a1a';c.fillRect(-14,11,4,6);c.fillStyle='#d9822b';c.beginPath();c.arc(17,17,12,0,6.3);c.fill();c.fillStyle='#f0a850';c.beginPath();c.arc(14,14,5,0,6.3);c.fill();c.strokeStyle='#7a3f12';c.lineWidth=2;c.beginPath();c.arc(17,17,12,0,6.3);c.stroke();c.strokeStyle='#b8651f';c.lineWidth=3;c.beginPath();c.moveTo(27,21);c.quadraticCurveTo(38,24,34,33);c.stroke();c.restore()}
function obs(){ob.forEach(o=>{const x=o.x;if(o.k=='drop'){c.fillStyle='#d99a1e';c.beginPath();c.moveTo(x+8,GY-o.h);c.quadraticCurveTo(x+22,GY-o.h*.35,x+8,GY);c.quadraticCurveTo(x-6,GY-o.h*.35,x+8,GY-o.h);c.fill();c.strokeStyle='#7a4b12';c.lineWidth=2;c.stroke();c.fillStyle='#fff3c4aa';c.beginPath();c.arc(x+5,GY-o.h*.35,2.5,0,6.3);c.fill()}
else if(o.k=='pool'){c.fillStyle='#8a5a14';c.beginPath();c.ellipse(x+28,GY-3,28,8,0,0,6.3);c.fill();c.strokeStyle='#d99a1e';c.lineWidth=2;c.beginPath();c.ellipse(x+28,GY-4,16,4,0,0,6.3);c.stroke()}
else{c.fillStyle='#3a2210';c.fillRect(x,GY-12,24,12);const w=Math.sin(f*.3)*3;c.fillStyle='#e8604c';c.beginPath();c.moveTo(x+12,GY-o.h);c.quadraticCurveTo(x+24+w,GY-22,x+20,GY-12);c.lineTo(x+4,GY-12);c.quadraticCurveTo(x-w,GY-24,x+12,GY-o.h);c.fill();c.fillStyle='#f5c242';c.beginPath();c.moveTo(x+12,GY-30);c.quadraticCurveTo(x+19,GY-20,x+16,GY-12);c.lineTo(x+8,GY-12);c.quadraticCurveTo(x+5,GY-20,x+12,GY-30);c.fill()}})}
function draw(){bg();trail();canting();obs();c.fillStyle='#4a2c14';c.font='700 18px sans-serif';c.textAlign='right';c.fillText('Skor '+Math.floor(sc),625,28);c.font='13px sans-serif';c.fillText('Kecepatan x'+(sp/3.2).toFixed(1),625,46);c.textAlign='left';
if(st!=1){c.fillStyle='#2b1a0ecc';c.fillRect(0,0,640,200);c.fillStyle='#f7ecd0';c.textAlign='center';c.font='700 24px sans-serif';c.fillText(st==0?'Tekan Spasi / ketuk untuk mulai':'Game over · Skor '+Math.floor(sc),320,88);c.font='15px sans-serif';c.fillText(st==0?'Nyanting sambil melompati tetesan malam, genangan, dan api kompor':'Tekan Spasi / ketuk untuk main lagi',320,118);c.textAlign='left'}}
function spawn(){const r=Math.random(),k=sc>60&&r<.3?'flame':sc>25&&r<.55?'pool':'drop',o={k,x:660};if(k=='drop'){o.w=16;o.h=22+Math.random()*12}else if(k=='pool'){o.w=56;o.h=12}else{o.w=24;o.h=46}ob.push(o);gap=250+sp*26+Math.random()*150}
function loop(t){if(st!=1||!cv.isConnected)return;const dt=last?Math.min(2.5,(t-last)/16.67):1;last=t;f+=dt;
const tg=3.2+Math.min(4.4,Math.sqrt(sc)/6.5);sp+=(tg-sp)*.02*dt;sc+=sp*dt/20;vy+=.6*dt;y=Math.min(G,y+vy*dt);if(y>=G){y=G;vy=0}

ob.forEach(o=>o.x-=sp*dt);ob=ob.filter(o=>o.x>-70);tr.forEach(p=>p.x-=sp*dt);tr=tr.filter(p=>p.x>-5);tr.push({x:96,y:y+32});
